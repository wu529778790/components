<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>user-avatar demo · 微信登录头像组件</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f8fafc, #eef2f7);
    min-height: 100vh;
    color: #1f2328;
  }
  .page { max-width: 760px; margin: 0 auto; padding: 4rem 1.5rem 3rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.4rem; }
  .sub { color: #656d76; font-size: 0.9rem; margin-bottom: 2rem; }
  code { background: rgba(27,31,36,0.06); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
</style>
</head>
<body>

<!-- ===== 组件挂载点：右上角头像（零配置，后端地址已默认写死） ===== -->
<user-avatar></user-avatar>

<div class="page">
  <h1>用户头像 · 账号组件（<code>@wu529778790/user-avatar</code>）</h1>
  <p class="sub">点右上角头像：未登录 → 微信登录；已登录 → 「设置 / 退出登录」→ 设置里可绑定 GitHub、改昵称。</p>
  <p class="sub">本页接入真实后端（微信认证服务 <code>https://wx-auth.shenzjd.com</code>），无任何模拟数据——登录、头像、昵称、GitHub 绑定全部真实。</p>
</div>

<!-- ===== 真实 SDK：wx-auth-sdk（UMD） ===== -->
<script src="https://unpkg.com/wx-auth-sdk@latest/dist/wx-auth.umd.js"></script>
<script>
  // 真初始化，按 SDK 官方的「延迟弹窗」模式（README「silent 模式」一节）：
  // - 先静默初始化：只校验现有 cookie，已登录静默通过，不弹窗（这是关键——
  //   默认 silent:false 时 init 遇到未认证会立刻强制弹窗，且关不掉）
  // - 需要登录时（点头像 / requireAuth）才弹窗
  // - required:false = 可选认证语义：弹窗带 × 关闭按钮，用户可主动关闭
  window.WxAuth && window.WxAuth.init({
    apiBase: 'https://wx-auth.shenzjd.com',
    silent: true,
    required: false
  })
</script>

<!-- ===== 组件（Web Component 单文件，CDN 正式版） ===== -->
<script src="https://unpkg.com/@wu529778790/user-avatar@latest/dist/user-avatar.wc.js"></script>

</body>
</html>
