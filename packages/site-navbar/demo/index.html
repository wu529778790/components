<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>site-navbar demo · 顶部导航组件</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f8fafc, #eef2f7);
    min-height: 100vh;
    color: #1f2328;
  }

  /* 复现真实场景：sticky + backdrop-blur 的 Header（导航组件挂在里面） */
  .demo-header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 0.75rem 1.5rem;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(27, 31, 36, 0.08);
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 3rem 1.5rem 3rem;
  }
  h1 { font-size: 1.6rem; margin: 0 0 0.4rem; }
  .sub { color: #656d76; font-size: 0.9rem; margin-bottom: 2rem; }
  code { background: rgba(27,31,36,0.06); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
  .spacer { height: 140vh; }
</style>
</head>
<body>

<!-- ===== sticky + backdrop-blur Header：导航组件挂在这里 ===== -->
<header class="demo-header">
  <site-navbar brand="我的导航" brand-icon="🧭"></site-navbar>
</header>

<div class="page">
  <h1>顶部导航组件（<code>@wu529778790/site-navbar</code>）</h1>
  <p class="sub">内置 shenzjd.com 系列子站链接，自动高亮当前站；移动端（&lt;768px）折叠为 hamburger 下拉菜单。</p>
  <p class="sub">头像已内置（user-avatar）：未登录 → 微信登录；已登录 → 设置 / 退出登录。点右上角头像试试。</p>
  <p class="sub">把窗口缩到 768px 以下，看移动端菜单。</p>

  <!-- 加高页面以制造滚动，验证 sticky Header 正常 -->
  <div class="spacer"></div>
</div>

<!-- ===== 真实 SDK：wx-auth-sdk（UMD），头像登录依赖它 ===== -->
<script src="https://unpkg.com/wx-auth-sdk@latest/dist/wx-auth.umd.js"></script>
<script>
  // silent:true = 加载时只静默校验登录态、绝不自动弹登录窗
  // required:false = 可选认证：弹窗带 × 关闭按钮
  window.WxAuth && window.WxAuth.init({
    silent: true,
    required: false
  })
</script>

<!-- ===== 组件（Web Component 单文件，本地 dist 构建产物） ===== -->
<script src="../dist/site-navbar.wc.js"></script>

</body>
</html>
