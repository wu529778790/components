<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>components · 组件库在线演示</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #fafafa;
      color: #333;
    }
    .wrap { text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #888; font-size: 13px; margin: 0 0 28px; }
    .cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    a.card {
      display: block;
      width: 220px;
      padding: 20px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    a.card:hover { border-color: #185fa5; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .card .name { font-size: 15px; font-weight: 500; }
    .card .desc { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>components · 组件库在线演示</h1>
    <p>零配置前端组件 · 每个组件独立发版 npm</p>
    <div class="cards">
      <a class="card" href="packages/floating-qr/demo/index.html">
        <div class="name">floating-qr</div>
        <div class="desc">公众号 + 赞赏码浮窗组件<br />极简 · 零依赖 · CDN 零代码接入</div>
      </a>
    </div>
  </div>
</body>
</html>
