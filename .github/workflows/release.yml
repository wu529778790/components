# 自动发布到 npm（OIDC Trusted Publishing，免 token）
#
# 流程：push 到 main → 自动给「有变更的包」加一个小版本（patch）→ 构建 → 自动发布到 npm
# 无需手动跑任何命令，也无需 changesets 版本 PR。
#
# 认证：npm Trusted Publishing（OIDC），无需配置 token。
#   npm 端：每个包在 npmjs.com → Settings → Trusted Publisher 配置：
#   Provider=GitHub Actions / Organization=wu529778790 / Repository=components / Workflow=release.yml
#   （首次发布需手动：npm login && npm publish --access public）
#
# 注意：
#   - 不要设置 NODE_AUTH_TOKEN / NPM_TOKEN（设了会禁用 OIDC）
#   - 版本 commit 由 GITHUB_TOKEN 推送，不会再次触发本 workflow（防递归）

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 提交版本号变更
  id-token: write # 必需：请求 OIDC token 用于 npm 发布

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager 字段决定（单一来源）

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports OIDC publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changed packages
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BEFORE="HEAD~1"
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git hash-object -t tree /dev/null)"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" \
            | sed -n 's|^packages/\([^/]*\)/.*|\1|p' | sort -u)
          echo "changed=$CHANGED"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Bump patch version for changed packages
        if: steps.changed.outputs.changed != ''
        run: |
          for pkg in ${{ steps.changed.outputs.changed }}; do
            (cd "packages/$pkg" && npm version patch --no-git-tag-version)
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "chore: bump patch version [skip ci]"
          git push

      - name: Build all packages
        run: pnpm build

      - name: Publish changed packages to npm
        if: steps.changed.outputs.changed != ''
        run: |
          for pkg in ${{ steps.changed.outputs.changed }}; do
            echo ">> Publishing packages/$pkg"
            (cd "packages/$pkg" && npm publish)
          done
