# 自动发布到 npm（OIDC Trusted Publishing，免 token）
#
# 流程：push 到 main → 自动给「有变更的包」加一个小版本（patch）→ 构建 → 自动发布到 npm
# 无需手动跑任何命令，也无需 changesets 版本 PR。
#
# 认证：npm Trusted Publishing（OIDC），无需配置 token。
#   npm 端：每个包在 npmjs.com → Settings → Trusted Publisher 配置：
#   Provider=GitHub Actions / Organization=wu529778790 / Repository=components / Workflow=release.yml
#   （首次发布需手动：npm login && npm publish --access public）
#
# 注意：
#   - 不要设置 NODE_AUTH_TOKEN / NPM_TOKEN（设了会禁用 OIDC）
#   - 版本 commit 由 GITHUB_TOKEN 推送，不会再次触发本 workflow（防递归）

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 提交版本号变更
  id-token: write # 必需：请求 OIDC token 用于 npm 发布

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager 字段决定（单一来源）

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports OIDC publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changed packages
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BEFORE="HEAD~1"
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git hash-object -t tree /dev/null)"
          fi
          # 只统计影响构建产物的包（排除 demo/test/dist 文档类变更，避免误触发发版）
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" \
            | grep -E '^packages/[^/]+/.*' \
            | grep -vE '^packages/[^/]+/(demo|test|dist)/' \
            | sed -n 's|^packages/\([^/]*\)/.*|\1|p' \
            | sort -u \
            | tr '\n' ' ')
          # 单行空格分隔输出（多行值写 GITHUB_OUTPUT 会报 Invalid format）
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Bump patch version for changed packages
        id: bump
        if: steps.changed.outputs.changed != ''
        run: |
          for pkg in ${{ steps.changed.outputs.changed }}; do
            (cd "packages/$pkg" && npm version patch --no-git-tag-version)
          done
          # 输出每次 <pkg>@<version>，供 publish 步骤做「已发布则跳过」的幂等判断
          VERSIONS=""
          for pkg in ${{ steps.changed.outputs.changed }}; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            VERSIONS="$VERSIONS $pkg@$v"
          done
          echo "versions=$(echo $VERSIONS | xargs)" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "chore: bump patch version [skip ci]" || echo "无变更可提交"
          # 并发 / 延迟触发下，远端可能已被其他 job 抢先写入版本号：
          # 先 rebase 融合；rebase 冲突或 push 被拒都视为「远端已落地该版本」，
          # 不把回写冲突当成流程失败（版本发布本体在下一步校验）。
          git pull --rebase origin "$GITHUB_REF_NAME" 2>&1 || {
            echo "::warning::远端已有并发提交，本地版本号与远端冲突，以远端为准继续"
            git rebase --abort 2>/dev/null || true
          }
          git push 2>&1 || { echo "::warning::版本号回写被拒（远端已推进），视为已由并发 job 落地"; }

      - name: Build all packages
        run: pnpm build

      - name: Publish changed packages to npm
        if: steps.changed.outputs.changed != ''
        run: |
          # 幂等：目标版本已在 npm 上（并发 job 已发布）则跳过，避免
          # 「版本已存在」报错把整个流程标红。
          for item in ${{ steps.bump.outputs.versions }}; do
            pkg="${item%@*}"; ver="${item#*@}"
            name=$(node -p "require('./packages/$pkg/package.json').name")
            echo ">> Publishing $name@$ver"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "  ✔ $ver 已存在于 npm（并发 job 已发布），跳过"
            else
              (cd "packages/$pkg" && npm publish)
            fi
          done
